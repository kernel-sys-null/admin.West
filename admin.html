<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Administrar · West Florería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--ink:#111;--mute:#6b6b6b;--line:#e4e4e1;--rose:#e8647a}
body{font:16px/1.5 'Instrument Sans',system-ui,sans-serif;background:#f5f5f3;color:var(--ink);padding:20px 16px 80px}
.box{max-width:720px;margin:0 auto}
h1{font:500 32px 'Bodoni Moda',Georgia,serif}h2{font:500 24px 'Bodoni Moda',Georgia,serif;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
.n{color:var(--mute);font-size:14px;margin:6px 0 12px}
.f{margin-bottom:14px}.f label{display:block;font-size:14px;color:var(--mute);margin-bottom:4px}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--rose);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.b{font:500 15px 'Instrument Sans',system-ui,sans-serif;padding:11px 20px;border:1px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);cursor:pointer;transition:transform .2s,background .25s,color .25s}
.b:hover{transform:translateY(-2px)}.b:active{transform:scale(.96)}.b.k{background:var(--ink);color:#fff}.b.s{padding:7px 14px;font-size:13px}
.row,.ab,.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:16px}.b.on{background:var(--rose);border-color:var(--rose);color:#fff}
.pr{display:grid;grid-template-columns:56px 1fr;gap:8px 12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.th{width:56px;height:56px;border-radius:12px;background:#f2d9de;overflow:hidden}.th img,.pv{width:100%;height:100%;object-fit:cover}
.pr small{display:block;color:var(--mute)}.ab{grid-column:1/-1}
.pv{display:block;width:120px;height:120px;border-radius:12px;margin-top:10px}
.hh{display:grid;grid-template-columns:1fr 100px 100px;gap:8px;align-items:center;margin-bottom:8px}.hh label{display:flex;gap:8px;align-items:center}.hh input[type=checkbox]{width:auto}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;opacity:0;transition:.35s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){.two{grid-template-columns:1fr}.hh{grid-template-columns:1fr 84px 84px}}
</style>
</head>
<body>
<div class="box"><div id="app"><p class="n">Cargando…</p></div></div>
<div id="toast"></div>

<script>
/* Si algo falla al cargar, lo muestra en pantalla en vez de dejarla en blanco */
(function(){
  function show(m){
    var a=document.getElementById('app');if(!a||window.__listo)return;
    a.innerHTML='<div class="card"><h2>No se pudo cargar el panel</h2><p class="n" id="err"></p><p class="n">Revisa: 1) abre esta página desde su enlace https (GitHub Pages o Netlify), no con doble clic ni desde la vista previa; 2) pega tu firebaseConfig dentro de este archivo; 3) que ningún bloqueador o red bloquee www.gstatic.com.</p></div>';
    document.getElementById('err').textContent=m;
  }
  addEventListener('error',function(e){show(e.message||'Error desconocido')});
  addEventListener('unhandledrejection',function(e){show(String((e.reason&&e.reason.message)||e.reason))});
  setTimeout(function(){show('Firebase no respondió a tiempo.')},6000);
})();
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,writeBatch,onSnapshot,query,orderBy}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* Pega aquí la MISMA configuración que pusiste en index.html */
const firebaseConfig={apiKey:"AIzaSyD0wRf5ekjP5r28mqCbiUOQB6cLbeQAIqQ",authDomain:"floreria-west.firebaseapp.com",projectId:"floreria-west",storageBucket:"floreria-west.firebasestorage.app",messagingSenderId:"187344310705",appId:"1:187344310705:web:647663485ccb8b5fff6d90"};

const CONFIG_OK=firebaseConfig.apiKey!=="TU_API_KEY";
const app=CONFIG_OK?initializeApp(firebaseConfig):null,auth=app&&getAuth(app),db=app&&getFirestore(app);
const $=s=>document.querySelector(s),dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=[['Ramo clásico','Ramos',350,'Doce rosas rojas con follaje y papel kraft.'],['Ramo blanco','Ramos',480,'Rosas y lisianthus blancos con envoltura negra.'],['Girasoles','Ramos',420,'Seis girasoles con eucalipto.'],['Caja minimal','Cajas',650,'Caja negra con rosas y paniculata.'],['Caja redonda','Cajas',950,'Arreglo grande en caja, ideal para regalar.'],['Centro de mesa','Eventos',780,'Arreglo bajo en tonos neutros.'],['Ramo de novia','Bodas',1500,'A la medida. Cotiza con anticipación.']];
let user=null,P=[],tab='p',ed=null,unsub=null,CFG={nombre:'West Florería',wa:'522221839086',ig:'floreria.west.cholula',horario:{0:[10,15],1:[9,20],2:[9,20],3:[9,20],4:[9,20],5:[9,20],6:[9,20]}};

let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)};
const fail=e=>toast(e.code==='permission-denied'?'Sin permiso: revisa que el UID de las reglas sea el tuyo.':'No se pudo guardar ('+(e.code||e.message)+')');
const run=async f=>{try{await f()}catch(e){fail(e)}};
const hrs=n=>[...Array(24)].map((_,x)=>`<option value="${x}"${x===n?' selected':''}>${x}:00</option>`).join('');

function v(){
  const A=$('#app');
  if(!user){A.innerHTML=`<div class="top"><h1>West Florería</h1></div><div class="card"><h2>Entrar</h2><p class="n">Acceso solo para el propietario.</p><div class="f"><label>Correo</label><input id="em" type="email" autocomplete="username"></div><div class="f"><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div><button class="b k" data-a="in">Entrar</button></div>`;return}
  let b='';
  if(tab==='p'&&ed){
    b=`<div class="card"><h2>${ed.id?'Editar':'Nuevo'} producto</h2>
    <div class="f"><label>Nombre</label><input data-e="n" value="${esc(ed.n)}"></div>
    <div class="two f"><div><label>Categoría</label><input data-e="c" list="cl" value="${esc(ed.c)}"><datalist id="cl">${[...new Set(P.map(x=>x.c))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div><label>Precio (MXN)</label><input data-e="p" type="number" min="0" value="${ed.p}"></div></div>
    <div class="f"><label>Descripción</label><textarea data-e="d">${esc(ed.d)}</textarea></div>
    <div class="f"><label>Foto (opcional)</label><input type="file" accept="image/*" id="ph">${ed.f?`<img class="pv" src="${ed.f}" alt="">`:''}</div>
    <div class="row"><button class="b k" data-a="sv">Guardar</button><button class="b" data-a="cn">Cancelar</button>${ed.f?'<button class="b" data-a="nf">Quitar foto</button>':''}</div></div>`;
  }else if(tab==='p'){
    b=`<div class="f"><button class="b k" data-a="nw">+ Nuevo producto</button></div>`+(P.length?'':`<div class="card"><p class="n">Todavía no hay productos en la base de datos; la página muestra los de ejemplo.</p><button class="b" data-a="seed">Cargar productos de ejemplo</button></div>`)
    +P.map((p,i)=>`<div class="pr"><div class="th">${p.f?`<img src="${p.f}" alt="">`:''}</div><div><b>${esc(p.n)}</b><small>${esc(p.c)} · $${p.p}${p.o?' · oculto':''}</small></div><div class="ab"><button class="b s" data-a="up" data-i="${i}" aria-label="Subir">↑</button><button class="b s" data-a="dn" data-i="${i}" aria-label="Bajar">↓</button><button class="b s" data-a="ed" data-i="${i}">Editar</button><button class="b s" data-a="ho" data-i="${i}">${p.o?'Mostrar':'Ocultar'}</button><button class="b s" data-a="de" data-i="${i}">Borrar</button></div></div>`).join('');
  }else if(tab==='h'){
    b=`<div class="card"><h2>Horario</h2>`+dias.map((d,i)=>{const h=CFG.horario[i];return `<div class="hh"><label><input type="checkbox" data-d="${i}" data-k="on"${h?' checked':''}>${d}</label><select data-d="${i}" data-k="a"${h?'':' disabled'}>${hrs(h?h[0]:9)}</select><select data-d="${i}" data-k="c"${h?'':' disabled'}>${hrs(h?h[1]:20)}</select></div>`}).join('')+`<p class="n">Marca el día para abrirlo. Los selectores son la hora de apertura y de cierre.</p><button class="b k" data-a="sc">Guardar horario</button></div>`;
  }else{
    b=`<div class="card"><h2>Datos del negocio</h2>`+[['nombre','Nombre del negocio'],['wa','WhatsApp (con lada país, sin + ni espacios)'],['ig','Usuario de Instagram']].map(([k,l])=>`<div class="f"><label>${l}</label><input data-s="${k}" value="${esc(CFG[k])}"></div>`).join('')+`<button class="b k" data-a="sc">Guardar datos</button></div>`;
  }
  A.innerHTML=`<div class="top"><h1>Administrar</h1><button class="b s" data-a="out">Salir</button></div><div class="tabs">${[['p','Productos'],['h','Horario'],['a','Datos']].map(([k,l])=>`<button class="b${tab===k?' on':''}" data-a="t" data-t="${k}">${l}</button>`).join('')}</div>${b}`;
}

if(!CONFIG_OK){$('#app').innerHTML='<div class="card"><h2>Falta la configuración</h2><p class="n">Pega tu firebaseConfig (Firebase → Configuración del proyecto → Tus apps → Web) en este archivo y vuelve a subirlo.</p></div>'}
else onAuthStateChanged(auth,async u=>{
  user=u;if(unsub){unsub();unsub=null}P=[];ed=null;
  if(u){
    try{const s=await getDoc(doc(db,'config','sitio'));if(s.exists())Object.assign(CFG,s.data())}catch(e){}
    unsub=onSnapshot(query(collection(db,'productos'),orderBy('orden')),s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));if(!ed)v()},e=>fail(e));
  }
  v();
});

window.__listo=true;
setTimeout(()=>{if(CONFIG_OK&&$('#app').textContent.trim()==='Cargando…')v()},2500);

const mover=async(i,d)=>{const j=i+d;if(j<0||j>=P.length)return;const a=P[i],c=P[j],w=writeBatch(db);w.update(doc(db,'productos',a.id),{orden:c.orden});w.update(doc(db,'productos',c.id),{orden:a.orden});await w.commit()};
const saveCfg=()=>setDoc(doc(db,'config','sitio'),CFG);

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,i=+t.dataset.i;
  run(async()=>{
    if(a==='in'){try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(x){toast('Correo o contraseña incorrectos')}}
    else if(a==='out')await signOut(auth);
    else if(a==='t'){tab=t.dataset.t;ed=null;v()}
    else if(a==='nw'){ed={n:'',c:'',p:0,d:'',f:'',o:false};v()}
    else if(a==='ed'){ed={...P[i]};v()}
    else if(a==='cn'){ed=null;v()}
    else if(a==='nf'){ed.f='';v()}
    else if(a==='sv'){
      const data={n:ed.n.trim()||'Sin nombre',c:ed.c.trim()||'Otros',p:+ed.p||0,d:ed.d.trim(),f:ed.f||'',o:!!ed.o};
      if(ed.id)await setDoc(doc(db,'productos',ed.id),{...data,orden:ed.orden});
      else await addDoc(collection(db,'productos'),{...data,orden:P.length?Math.max(...P.map(x=>x.orden))+1:0});
      ed=null;v();toast('Producto guardado');
    }
    else if(a==='up'||a==='dn')await mover(i,a==='up'?-1:1);
    else if(a==='ho'){await updateDoc(doc(db,'productos',P[i].id),{o:!P[i].o})}
    else if(a==='de'){if(confirm('¿Borrar "'+P[i].n+'"?'))await deleteDoc(doc(db,'productos',P[i].id))}
    else if(a==='sc'){CFG.wa=String(CFG.wa).replace(/\D/g,'');await saveCfg();toast('Cambios guardados')}
    else if(a==='seed'){const w=writeBatch(db);DEF.forEach(([n,c,p,d],x)=>w.set(doc(collection(db,'productos')),{n,c,p,d,f:'',o:false,orden:x}));w.set(doc(db,'config','sitio'),CFG);await w.commit();toast('Productos de ejemplo cargados')}
  });
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pw')document.querySelector('[data-a=in]').click()});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.e&&ed)ed[t.dataset.e]=t.dataset.e==='p'?+t.value:t.value;
  else if(t.dataset.s)CFG[t.dataset.s]=t.value.trim()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.k){const d=+t.dataset.d,k=t.dataset.k;if(k==='on'){CFG.horario[d]=t.checked?[9,20]:null;v()}else CFG.horario[d][k==='a'?0:1]=+t.value}
  else if(t.id==='ph'&&t.files[0]){const im=new Image();im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ed.f=c.toDataURL('image/jpeg',.75);v()};im.src=URL.createObjectURL(t.files[0])}});
</script>
</body>
</html>
